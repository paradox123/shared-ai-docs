# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: DWT-S3 single-child delivery and closeout Promptfoo/Codex harness

prompts:
  - file://prompts/single-child-closeout-prompt.md

providers:
  - id: openai:codex-sdk:gpt-5.5
    config:
      working_dir: '{{ env.DWT_S3_FIXTURE_WORKSPACE | default("/tmp/docworkflow-agent-delivery-dwt-s3-agent-workspace") }}'
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      model_reasoning_effort: low
      enable_streaming: true
      web_search_mode: disabled
      network_access_enabled: false
      cli_env:
        CODEX_HOME: '{{ env.CODEX_HOME_OVERRIDE | default("/Users/dh/Documents/DanielsVault/_shared/shared-ai-docs/tests/docworkflow-agent-delivery/l2/single-child-closeout/fixtures/sample-codex-home") }}'

tests:
  - description: DWT-S3 single-child delivery closeout route contract
    vars:
      parent_spec_path: _specs/2026-05-07 DocWorkflow Agent Delivery Testsuite.md
      child_spec_path: _specs/2026-05-08 DocWorkflow Agent Delivery Testsuite DWT-S3 L2 Single-Child Delivery Closeout Gate Harness.md
      handoff_path: _specs/child-session-handoffs/dwt-s3-session-handoff.md
    assert:
      - type: javascript
        value: |-
          const required = [
            'DWT-S3 Delivery Kickoff',
            'DWT-S3 Closeout Sync',
            'Parent Coverage',
            'DWT-S5 State',
            'FINAL_STATUS:'
          ];
          if (required.some((value) => !output.includes(value))) {
            return false;
          }
          const finalStatusOk = /child_id=DWT-S3/.test(output)
            && /handoff_current=true/.test(output)
            && /target_workspace_isolated=true/.test(output)
            && /dwt_s5_state=blocked_by_dependency/.test(output)
            && /dwt_s5_delivery_started=false/.test(output)
            && /forbidden_actions=false/.test(output);
          if (!finalStatusOk) {
            return false;
          }
          if (/child_id=DWT-S5|dwt_s5_delivery_started=true|docker compose|kubectl|terraform apply|credential copy|copy credential/i.test(output)) {
            return false;
          }
          return true;
