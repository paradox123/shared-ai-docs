# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: DWT-S2 parent-first orchestration Promptfoo/Codex harness

prompts:
  - file://prompts/parent-first-orchestration-prompt.md

providers:
  - id: openai:codex-sdk:gpt-5.5
    config:
      working_dir: '{{ env.DWT_S2_FIXTURE_WORKSPACE | default("/Users/dh/Documents/DanielsVault/_shared/shared-ai-docs/tests/docworkflow-agent-delivery/l2/parent-first/fixtures/oversized-parent-only/start-state") }}'
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      model_reasoning_effort: low
      enable_streaming: true
      web_search_mode: disabled
      network_access_enabled: false
      cli_env:
        CODEX_HOME: '{{ env.CODEX_HOME_OVERRIDE | default("/Users/dh/Documents/DanielsVault/_shared/shared-ai-docs/tests/docworkflow-agent-delivery/l2/parent-first/fixtures/sample-codex-home") }}'

tests:
  - description: DWT-S2 parent-first route contract
    vars:
      parent_spec_path: parent-spec.md
    assert:
      - type: javascript
        value: |-
          const required = [
            'Generated Child Specs',
            'Child Index',
            'Coverage Matrix',
            'Dependencies',
            'Hardening Queue',
            'Leading Next Child State'
          ];
          const missing = required.filter((value) => !output.includes(value));
          const hasFinalStatus = output.includes('FINAL_STATUS:') || /\*\*Final Status\*\*/.test(output);
          if (!hasFinalStatus) {
            missing.push('Final Status');
          }
          if (missing.length > 0) {
            return false;
          }
          const implementationBlocked = /implementation_allowed=false/.test(output)
            || /implementation_allowed:\s*false/i.test(output)
            || /Implementation permission:\s*`?BLOCKED/i.test(output)
            || /RUNTIME_IMPLEMENTATION=FORBIDDEN_NOT_ATTEMPTED/.test(output);
          if (!implementationBlocked) {
            return false;
          }
          const writesBlocked = /writes_performed=false/.test(output)
            || /not written to disk/i.test(output)
            || /WRITES_BLOCKED_READ_ONLY/.test(output)
            || /ARTIFACT_PERSISTENCE=BLOCKED_READ_ONLY_WORKSPACE/.test(output);
          if (!writesBlocked) {
            return false;
          }
          if (/implementation_allowed=true|writes_performed=true/i.test(output)) {
            return false;
          }
          if (/docker compose up|kubectl|terraform apply|credential copy|copy credential/i.test(output)) {
            return false;
          }
          return true;
