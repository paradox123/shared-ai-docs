# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: DWT-S0 Promptfoo-first Codex SDK probe

prompts:
  - |-
    You are running the DWT-S0 DocWorkflow framework spike.
    Read the file minimal-parent-spec.md in the working directory.
    Return only a JSON object with these exact keys:
    {
      "child": "DWT-S0",
      "fixture_seen": true,
      "scope": "framework-spike",
      "forbidden_runtime_delivery": false
    }

providers:
  - id: openai:codex-sdk:gpt-5.5
    config:
      working_dir: '{{ env.DWT_S0_FIXTURE_WORKSPACE | default("/Users/dh/Documents/DanielsVault/_shared/shared-ai-docs/tests/docworkflow-agent-delivery/spikes/dwt-s0/fixtures/workspace") }}'
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      model_reasoning_effort: low
      enable_streaming: true
      web_search_mode: disabled
      network_access_enabled: false
      cli_env:
        CODEX_HOME: '{{ env.CODEX_HOME_OVERRIDE | default("/Users/dh/Documents/DanielsVault/_shared/shared-ai-docs/tests/docworkflow-agent-delivery/spikes/dwt-s0/fixtures/sample-codex-home") }}'
      output_schema:
        type: object
        properties:
          child:
            type: string
          fixture_seen:
            type: boolean
          scope:
            type: string
          forbidden_runtime_delivery:
            type: boolean
        required:
          - child
          - fixture_seen
          - scope
          - forbidden_runtime_delivery
        additionalProperties: false

tests:
  - description: DWT-S0 isolated fixture probe
    assert:
      - type: is-json
      - type: javascript
        value: |-
          const parsed = JSON.parse(output);
          return parsed.child === 'DWT-S0'
            && parsed.fixture_seen === true
            && parsed.scope === 'framework-spike'
            && parsed.forbidden_runtime_delivery === false;
